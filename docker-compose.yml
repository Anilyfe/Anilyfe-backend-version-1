services:
  postgres:
    image: postgres:16
    container_name: anilyfe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: anilyfe
      POSTGRES_PASSWORD: anilyfe
      POSTGRES_DB: anilyfe
    ports:
      - "5432:5432"
    volumes:
      - anilyfe_pgdata:/var/lib/postgresql/data
volumes:
  anilyfe_pgdata:
